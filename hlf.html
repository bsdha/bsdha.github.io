<script>
// ===== SHA-256 / HMAC-SHA256 thuần JS — PHẢI giống hệt bản trong script
// Helixfast (.user.js) để ra cùng chữ ký. Nếu sửa 1 bên thì phải sửa cả 2. =====
function sha256Bytes(messageBytes) {
  const K = new Uint32Array([

    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2,
  ]);
  let H = new Uint32Array([
    0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19,
  ]);
  const bitLen = messageBytes.length * 8;
  const withOne = new Uint8Array(((messageBytes.length + 9 + 63) >> 6) << 6);
  withOne.set(messageBytes);
  withOne[messageBytes.length] = 0x80;
  const dv = new DataView(withOne.buffer);
  dv.setUint32(withOne.length - 4, bitLen >>> 0, false);
  dv.setUint32(withOne.length - 8, Math.floor(bitLen / 4294967296), false);

  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

  for (let offset = 0; offset < withOne.length; offset += 64) {
    const w = new Uint32Array(64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(offset + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const temp1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (S0 + maj) >>> 0;
      h=g; g=f; f=e; e=(d+temp1)>>>0;
      d=c; c=b; b=a; a=(temp1+temp2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  const out = new Uint8Array(32);
  const outDv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) outDv.setUint32(i*4, H[i], false);
  return out;
}
function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0); out.set(b, a.length);
  return out;
}
function hmacSha256Hex(secretStr, messageStr) {
  const blockSize = 64;
  let key = new TextEncoder().encode(secretStr);
  if (key.length > blockSize) key = sha256Bytes(key);
  if (key.length < blockSize) { const p = new Uint8Array(blockSize); p.set(key); key = p; }
  const oKeyPad = new Uint8Array(blockSize);
  const iKeyPad = new Uint8Array(blockSize);
  for (let i = 0; i < blockSize; i++) { oKeyPad[i] = key[i]^0x5c; iKeyPad[i] = key[i]^0x36; }
  const msgBytes = new TextEncoder().encode(messageStr);
  const inner = sha256Bytes(concatBytes(iKeyPad, msgBytes));
  const digest = sha256Bytes(concatBytes(oKeyPad, inner));
  return Array.from(digest).map(b => b.toString(16).padStart(2,'0')).join('');
}
function base64urlEncode(str) {
  const b64 = btoa(unescape(encodeURIComponent(str)));
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

  const machineCode = document.getElementById('machineCode').value.trim();
  const years = parseFloat(document.getElementById('years').value) || 1;
  const dateStr = dateInput.value;

  if (!secret) { alert('Thiếu chuỗi bí mật.'); return; }
  if (!machineCode) { alert('Thiếu mã máy của khách hàng.'); return; }
  if (!dateStr) { alert('Thiếu ngày kích hoạt.'); return; }

  const activateDate = new Date(dateStr + 'T00:00:00');
  const expiryDate = new Date(activateDate.getTime());
  expiryDate.setFullYear(expiryDate.getFullYear() + Math.round(years));
  // Hết hạn vào cuối ngày đó (23:59:59) để tính đủ "1 năm liên tục".
  expiryDate.setHours(23, 59, 59, 0);

  const payload = {
    m: machineCode,
    exp: Math.floor(expiryDate.getTime() / 1000),
    iat: Math.floor(Date.now() / 1000),
  };
  const payloadB64 = base64urlEncode(JSON.stringify(payload));
  const sig = hmacSha256Hex(secret, payloadB64);
  const token = payloadB64 + '.' + sig;

  document.getElementById('tokenOut').value = token;
  document.getElementById('result').classList.add('show');

  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  document.getElementById('expInfo').textContent =
    `${fmt(activateDate)} → ${fmt(expiryDate)}`;
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const ta = document.getElementById('tokenOut');
  ta.select();
  navigator.clipboard && navigator.clipboard.writeText(ta.value).catch(() => document.execCommand('copy'));
  const btn = document.getElementById('copyBtn');
  const old = btn.textContent;
  btn.textContent = 'Đã copy ✓';
  setTimeout(() => (btn.textContent = old), 1200);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('machineCode').value = '';
  document.getElementById('tokenOut').value = '';
  document.getElementById('result').classList.remove('show');
});
</script>
</body>
</html>
