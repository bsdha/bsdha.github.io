<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý bán thuốc</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #f4f6f8; --surface: #fff; --border: #e2e6ea; --text: #1f2937; --muted: #6b7280;
    --blue: #2563eb; --green: #1f9c8f; --green-light: #e6f7f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .login-box { max-width: 340px; margin: 80px auto; text-align: center; }
  .login-box input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin: 10px 0; }
  .login-box button, .toolbar button { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  .login-box button:hover, .toolbar button:hover { opacity: .9; }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type="date"] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .stat { flex: 1; min-width: 140px; background: var(--green-light); border-radius: 10px; padding: 14px; text-align: center; }
  .stat .num { font-size: 26px; font-weight: 800; color: var(--green); }
  .stat .lbl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .qty { font-weight: 700; color: var(--green); }
  .muted { color: var(--muted); font-size: 12.5px; }
  .loading, .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 13.5px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="login-box card" id="loginBox">
      <h1>🔒 Quản lý bán thuốc</h1>
      <p class="muted">Nhập mật khẩu để xem báo cáo</p>
      <input type="password" id="passInput" placeholder="Mật khẩu" autocomplete="off">
      <div class="err" id="loginErr"></div>
      <button id="loginBtn">Đăng nhập</button>
    </div>

    <div id="dashBox" class="hidden">
      <h1>📊 Báo cáo bán thuốc</h1>
      <div class="toolbar">
        <input type="date" id="dateInput">
        <button id="refreshBtn">Xem báo cáo</button>
        <span class="muted" id="statusMsg"></span>
      </div>

      <div class="card">
        <div class="stat-row">
          <div class="stat"><div class="num" id="statOrders">–</div><div class="lbl">Đơn đã bán trong ngày</div></div>
          <div class="stat"><div class="num" id="statDrugTypes">–</div><div class="lbl">Loại thuốc đã bán</div></div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">Số lượng từng thuốc đã bán</h3>
        <div id="drugTableWrap"><div class="loading">Đang tải...</div></div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">Danh sách đơn đã bán</h3>
        <div id="ordersTableWrap"><div class="loading">Đang tải...</div></div>
      </div>
    </div>
  </div>

<script>
  // Đổi URL này thành domain Worker thực tế sau khi deploy rx-stats-worker.js
  const STATS_WORKER_URL = 'https://rx-stats.dhabolero.workers.dev/rx-stats';

  const loginBox = document.getElementById('loginBox');
  const dashBox = document.getElementById('dashBox');
  const passInput = document.getElementById('passInput');
  const loginErr = document.getElementById('loginErr');
  const dateInput = document.getElementById('dateInput');
  const statusMsg = document.getElementById('statusMsg');

  let currentPassword = sessionStorage.getItem('rxStatsPass') || '';

  function todayVnStr() {
    const now = new Date(Date.now() + 7 * 3600 * 1000); // dịch sang giờ VN
    return now.toISOString().slice(0, 10);
  }
  dateInput.value = todayVnStr();

  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function modeLabel(m) {
    if (m === 'outside') return 'Ngoài BV';
    if (m === 'handwritten') return 'Viết tay';
    return 'Trong BV';
  }

  async function loadStats() {
    statusMsg.textContent = 'Đang tải...';
    document.getElementById('drugTableWrap').innerHTML = '<div class="loading">Đang tải...</div>';
    document.getElementById('ordersTableWrap').innerHTML = '<div class="loading">Đang tải...</div>';
    try {
      const resp = await fetch(STATS_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: currentPassword, date: dateInput.value }),
      });
      if (resp.status === 401) {
        sessionStorage.removeItem('rxStatsPass');
        showLogin('Sai mật khẩu, vui lòng nhập lại.');
        return;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      renderStats(data);
      statusMsg.textContent = '';
    } catch (e) {
      statusMsg.textContent = 'Lỗi tải báo cáo: ' + e.message;
    }
  }

  function renderStats(data) {
    document.getElementById('statOrders').textContent = data.total_orders ?? 0;
    document.getElementById('statDrugTypes').textContent = (data.drugs || []).length;

    const drugs = data.drugs || [];
    document.getElementById('drugTableWrap').innerHTML = drugs.length
      ? `<table><thead><tr><th>Thuốc</th><th>Dạng</th><th>Số lượng đã bán</th></tr></thead><tbody>
          ${drugs.map((d) => `<tr><td><b>${esc(d.brand)}</b>${d.generic ? ' <span class="muted">(' + esc(d.generic) + ')</span>' : ''}</td><td class="muted">${esc(d.form)}</td><td class="qty">${esc(d.qty)}</td></tr>`).join('')}
        </tbody></table>`
      : '<div class="empty">Chưa có thuốc nào được bán trong ngày này.</div>';

    const orders = data.orders || [];
    document.getElementById('ordersTableWrap').innerHTML = orders.length
      ? `<table><thead><tr><th>Giờ bán</th><th>Bệnh nhân</th><th>Bác sĩ kê</th><th>Nơi kê</th><th>Số thuốc</th></tr></thead><tbody>
          ${orders.map((o) => `<tr><td>${esc(fmtTime(o.sold_at))}</td><td>${esc(o.patient_name || '(không tên)')}</td><td>${esc(o.doctor_name || '—')}</td><td>${esc(modeLabel(o.mode))}</td><td>${esc(o.item_count)}</td></tr>`).join('')}
        </tbody></table>`
      : '<div class="empty">Chưa có đơn nào được bán trong ngày này.</div>';
  }

  function showLogin(err) {
    loginBox.classList.remove('hidden');
    dashBox.classList.add('hidden');
    loginErr.textContent = err || '';
    passInput.value = '';
    passInput.focus();
  }
  function showDash() {
    loginBox.classList.add('hidden');
    dashBox.classList.remove('hidden');
    loadStats();
  }

  document.getElementById('loginBtn').addEventListener('click', () => {
    const p = passInput.value.trim();
    if (!p) return;
    currentPassword = p;
    sessionStorage.setItem('rxStatsPass', p);
    showDash();
  });
  passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
  document.getElementById('refreshBtn').addEventListener('click', loadStats);
  dateInput.addEventListener('change', loadStats);

  if (currentPassword) showDash(); else showLogin();
</script>
</body>
</html>
